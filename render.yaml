services:
  - type: web
    name: vyro-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false # Neon-hosted Postgres, not Render's own — paste the Neon connection string (with ?sslmode=require) when prompted
      - key: REDIS_URL
        fromService:
          name: vyro-redis
          type: keyvalue
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_SERVER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # BullMQ worker (lib/queue/worker.ts). Without this, generation jobs get
  # enqueued by vyro-web's API routes but nothing ever picks them up — the
  # queue just accumulates pending jobs silently.
  - type: worker
    name: vyro-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run worker
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false # same Neon connection string as vyro-web — set it here too, Render doesn't share sync:false values across services
      - key: REDIS_URL
        fromService:
          name: vyro-redis
          type: keyvalue
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: vyro-redis
    plan: starter
    ipAllowList: []

